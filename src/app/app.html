<a class="skip-link" href="#main">Skip to content</a>

<header class="app-header">
  <a routerLink="/" class="brand" aria-label="{{ config.title }} — home">
    <span class="brand-mark" aria-hidden="true">₹</span>
    <span class="brand-text">
      <strong>{{ config.title }}</strong>
      <small>{{ config.retailerName }}</small>
    </span>
  </a>
</header>

@if (!network.online()) {
  <div class="offline-bar" role="status">
    You're offline. You can fill in the form, but you'll need a connection to submit.
  </div>
}

<main id="main" class="app-main" tabindex="-1">
  <router-outlet />
</main>

<footer class="app-footer">
  <small>Rewards are allocated by our rewards partner. Revealing your result does not affect the outcome.</small>
</footer>
